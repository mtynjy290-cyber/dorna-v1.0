<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080F" />
      <stop offset="100%" stop-color="#11172C" />
    </linearGradient>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F090" />
      <stop offset="100%" stop-color="#00C475" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#CBD8E2" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgDarkGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Outer Architectural Door Frame -->
  <rect x="96" y="80" width="320" height="352" rx="24" fill="none" stroke="url(#neonGreenGrad)" stroke-width="12" />

  <!-- Top Header Operator Rail -->
  <rect x="90" y="74" width="332" height="46" rx="14" fill="#06080F" stroke="#00F090" stroke-width="4" />
  <circle cx="126" cy="97" r="6" fill="#00F090" />
  <circle cx="150" cy="97" r="6" fill="#FFFFFF" fill-opacity="0.8" />

  <!-- Left Sliding Glass Leaf -->
  <rect x="114" y="132" width="134" height="280" rx="12" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.7" />
  <path d="M124 142 L200 142 L144 390 L124 390 Z" fill="white" fill-opacity="0.12" />
  <!-- Left Handle -->
  <rect x="228" y="236" width="6" height="72" rx="3" fill="#00F090" />

  <!-- Right Sliding Glass Leaf -->
  <rect x="264" y="132" width="134" height="280" rx="12" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.7" />
  <path d="M274 142 L350 142 L294 390 L274 390 Z" fill="white" fill-opacity="0.12" />
  <!-- Right Handle -->
  <rect x="278" y="236" width="6" height="72" rx="3" fill="#00F090" />

  <!-- Motion Radar Sensor / Smart Signal Indicator -->
  <path d="M224 74 C224 46, 288 46, 288 74" fill="none" stroke="#00F090" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="58" r="6" fill="#00F090" />
</svg>
